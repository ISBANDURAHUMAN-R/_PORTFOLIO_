# Netlify Performance & Security Header Configuration

# 1. HTML documents: Always revalidate for instant updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 2. Stylesheets and scripts: 1-day browser cache with background revalidation
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# 3. Static Media, Images, Fonts and PDFs: Long-term immutable caching
[[headers]]
  for = "/*.{jpg,jpeg,png,webp,svg,gif,ico,woff,woff2,ttf,eot,pdf}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 4. Global Security Headers & Content Security Policy (Lighthouse Best Practices 100/100)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self'; connect-src 'self'; object-src 'self'; base-uri 'self'; form-action 'self' https://mail.google.com;"
