<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243D4E"/>
      <stop offset="50%" stop-color="#1B303D"/>
      <stop offset="100%" stop-color="#14242F"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#80BCDC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#A4D0E7" stroke-width="6" stroke-opacity="0.35"/>
  <text x="256" y="335" font-family="'Fraunces', Georgia, serif" font-size="220" font-weight="600" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">IR</text>
  <circle cx="256" cy="420" r="8" fill="#80BCDC" opacity="0.8"/>
</svg>
